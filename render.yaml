# ============================================================
# Render blueprint - CustomerVault backend (FastAPI)
# Database: TiDB Cloud (MySQL compatible, port 4000, TLS required)
# ============================================================
services:
  - type: web
    name: customervault-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/main.py --host 0.0.0.0 --port $PORT --trust-proxy
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # ---------- TiDB Cloud connection (cluster -> Connect -> connection type "Public") ----------
      - key: MYSQL_HOST          # e.g. gateway01.<region>.prod.aws.tidbcloud.com
        sync: false
      - key: MYSQL_PORT          # TiDB Cloud uses 4000
        value: "4000"
      - key: MYSQL_USER          # the FULL name with prefix, e.g. 2abc1234.root
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE      # "test" exists by default; or create your own, e.g. cs
        value: test
      - key: MYSQL_SSL           # TiDB Cloud requires a secure connection
        value: "true"

      # ---------- Frontend address (fill in after the Vercel deploy) ----------
      - key: CORS_ORIGINS        # e.g. https://my-site.vercel.app  (no trailing slash)
        sync: false

      # ---------- App behaviour ----------
      - key: CREATE_MISSING_CUSTOMER_TABLES
        value: "true"            # set to false after the first successful start
