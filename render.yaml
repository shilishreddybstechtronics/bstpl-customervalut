services:
  - type: web
    name: customervault
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: customer_database
      - key: DB_SSL
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
