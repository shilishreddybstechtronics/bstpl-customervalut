services:
  - type: web
    name: customervault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MYSQL_HOST
        value: mysql-28f91b17-shilish-0a63.g.aivencloud.com
      - key: MYSQL_PORT
        value: "24605"
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: customer_database
      - key: MYSQL_SSL
        value: "true"
