[build]
  publish = "frontend"

# Proxy API, Auth, and Health requests directly to the live Render backend
[[redirects]]
  from = "/auth/*"
  to = "https://bstpl-customervalut-2-jm3t.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "https://bstpl-customervalut-2-jm3t.onrender.com/health/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://bstpl-customervalut-2-jm3t.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
