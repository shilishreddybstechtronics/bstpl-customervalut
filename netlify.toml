[build]
  publish = "frontend"

# Proxy API, Auth, Health, and Sensorise requests directly to the live Render backend
[[redirects]]
  from = "/auth/*"
  to = "https://bstpl-customervalut-6-g6a8.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://bstpl-customervalut-6-g6a8.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "https://bstpl-customervalut-6-g6a8.onrender.com/health/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://bstpl-customervalut-6-g6a8.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sensorise/*"
  to = "https://bstpl-customervalut-6-g6a8.onrender.com/sensorise/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sim-upload.html"
  to = "/home.html"
  status = 301
  force = true

[[redirects]]
  from = "/sim-upload"
  to = "/home.html"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
