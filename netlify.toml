[build]
  publish = "frontend"

# Proxy API, Auth, and Health requests directly to the live Render backend
[[redirects]]
  from = "/auth/*"
  to = "https://bstpl-customervalut-l40y.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "https://bstpl-customervalut-l40y.onrender.com/health/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://bstpl-customervalut-l40y.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200
